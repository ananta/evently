services:
  db:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: evently_user
      POSTGRES_PASSWORD: evently_password
      POSTGRES_DB: evently_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evently_user -d evently_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  migration:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    # Runs on `docker compose up`. The Makefile targets override this to run
    # down, force and version instead.
    command:
      [
        "-path=/migrations",
        "-database=postgres://evently_user:evently_password@db:5432/evently_db?sslmode=disable",
        "up",
      ]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    ports:
      - "4000:4000"
    command:
      [
        "-db-dsn=postgres://evently_user:evently_password@db:5432/evently_db?sslmode=disable",
      ]
    depends_on:
      migration:
        condition: service_completed_successfully
volumes:
  postgres_data:
